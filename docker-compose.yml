services:
  traefik:
    image: traefik:v3.4
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - choreographer-net

  app:
    build: .
    container_name: pdf-extract-service
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-pdf_extractor}
      BASE64_PAYLOAD_MAX_SIZE_MB: ${BASE64_PAYLOAD_MAX_SIZE_MB:-25}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdf-extract.entrypoints=web"
      - "traefik.http.routers.pdf-extract.rule=Host(`extract.localhost`) && PathPrefix(`/`)"
      - "traefik.http.routers.pdf-extract.service=pdf-extract"
      - "traefik.http.services.pdf-extract.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - redis
      - mongo
    networks:
      - choreographer-net
      - internal

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  mongo:
    image: mongo:7
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  choreographer-net:
    external: true
  internal:
    driver: bridge

volumes:
  mongo-data: